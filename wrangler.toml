# wrangler.toml — Black Creek Barber
# Fill in database_id after running: wrangler d1 create stackwell-blackcreek

name = "stackwell-blackcreek"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "stackwell-blackcreek"
database_id = "1d295b84-1ae3-48bf-8e36-8751c0422010"

[vars]
SHOP_NAME = "Black Creek Barber"
RESEND_FROM = "bookings@stackwell.digital"
SLOT_INTERVAL = "30"
BOOKING_WINDOW_DAYS = "14"
MULTI_STAFF = "false"
CANCEL_CUTOFF_HOURS = "24"
SHOP_PHONE = ""          # ← add her phone number

# Optional Google Calendar
# GCAL_CALENDAR_ID = ""  # ← add if using GCal integration
